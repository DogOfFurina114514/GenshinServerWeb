name: Server Status Probe

on:
  schedule:
    - cron: '*/5 * * * *'  # 每 5 分钟自动跑一次
  workflow_dispatch:       # 允许在网页上手动点击触发

permissions:
  contents: write          # 允许脚本修改仓库文件（关键！）

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Probe Script
        run: node probe.js

      - name: Commit and Push status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          # 如果有变化才 commit，防止空提交报错
          git diff --staged --quiet || git commit -m "chore: update server status [skip ci]"
          git push
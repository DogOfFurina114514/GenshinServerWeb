<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器状态 - 芙芙的狗的服务器</title>
<style>
    html, body { margin: 0; min-height: 100%; }
    body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        position: relative; overflow-x: hidden;
    }
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .bubble {
        position: absolute; bottom: -100px; background: rgba(255,255,255,0.08); border-radius: 50%;
        box-shadow: 0 0 10px rgba(79,172,254,0.3); animation: rise 10s infinite ease-in;
    }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: .6; } 100% { transform: translateY(-110vh) scale(1.5); opacity: 0; } }
    .container {
        position: relative; z-index: 10; max-width: 520px; margin: 70px auto; padding: 50px 40px;
        background: rgba(255,255,255,0.08); border-radius: 24px;
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        animation: fadeIn 1s ease-out; text-align: center;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back { color: #a0c4ff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: .95em; line-height: 1; position: absolute; top: 24px; left: 28px; }
    .back:hover { color: #fff; }
    .icon { display: block; flex-shrink: 0; }
    h1 {
        color: #fff; font-size: 1.8em; margin: 0 0 40px 0; line-height: 1;
        text-shadow: 0 0 15px rgba(79,172,254,0.8); letter-spacing: 2px;
    }
    #bigDot {
        width: 110px; height: 110px; border-radius: 50%; margin: 0 auto;
        background: #556; transition: all .5s; position: relative;
    }
    #bigDot.ok { background: #43e97b; box-shadow: 0 0 60px rgba(67,233,123,0.8), 0 0 120px rgba(67,233,123,0.4); animation: pulse 2s infinite; }
    #bigDot.bad { background: #ff6e6e; box-shadow: 0 0 60px rgba(255,110,110,0.8), 0 0 120px rgba(255,110,110,0.4); }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    #statusText { color: #fff; font-size: 1.6em; font-weight: bold; margin: 26px 0 6px 0; line-height: 1; }
    #statusSub { color: rgba(255,255,255,0.45); font-size: .85em; min-height: 1.3em; margin: 0 0 34px 0; }
    .btn-refresh {
        width: 80%; border: none; cursor: pointer; color: #fff;
        padding: 15px 0; border-radius: 50px; font-size: 1.1em; font-weight: bold; line-height: 1;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 4px 18px rgba(79,172,254,0.45);
        transition: .3s; font-family: inherit;
    }
    .btn-refresh:hover { transform: translateY(-3px); }
    .note { color: rgba(255,255,255,0.4); font-size: .78em; margin: 18px 0 0 0; }
    footer { margin-top: 34px; color: rgba(255,255,255,0.3); font-size: .85em; }
</style>
</head>
<body>
<div class="bubbles">
    <div class="bubble" style="width: 40px; height: 40px; left: 10%; animation-duration: 8s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 20%; animation-duration: 5s; animation-delay: 1s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; left: 35%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; left: 50%; animation-duration: 15s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; left: 65%; animation-duration: 7s; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 80%; animation-duration: 10s; animation-delay: 2s;"></div>
</div>

<div class="container">
    <a href="index.html" class="back">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        返回主页
    </a>

    <h1>服务器状态</h1>

    <div id="bigDot"></div>
    <div id="statusText">检测中…</div>
    <div id="statusSub">正在连接世界树</div>

    <button class="btn-refresh" id="refreshBtn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        立即刷新
    </button>
    <p class="note">离线 = 游戏没启动或隧道掉了，找服主 · 每 30 秒自动刷新</p>

    <footer>Powered by Grasscutter · 芙芙的狗 专属构建</footer>
</div>

<script>
    const API = 'https://apidogoffurinagi.fucku.top';

    async function check() {
        const dot = document.getElementById('bigDot');
        const txt = document.getElementById('statusText');
        const sub = document.getElementById('statusSub');
        txt.textContent = '检测中…';
        sub.textContent = '正在连接世界树';
        dot.className = '';

        const t0 = performance.now();
        let ok = false;
        try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 5000);
            const res = await fetch(API + '/api/ping', { signal: ctrl.signal, cache: 'no-store' });
            const data = await res.json();
            clearTimeout(to);
            ok = !!data.ok;
            if (ok) sub.textContent = '延迟 ' + Math.round(performance.now() - t0) + 'ms · 提瓦特营业中';
        } catch (e) { /* 离线 */ }

        if (ok) { dot.className = 'ok'; txt.textContent = '在线'; }
        else { dot.className = 'bad'; txt.textContent = '离线'; sub.textContent = '游戏未启动或隧道断开'; }
    }

    document.getElementById('refreshBtn').addEventListener('click', check);
    check();
    setInterval(check, 30000);
</script>
</body>
</html>

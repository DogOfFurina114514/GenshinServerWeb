<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器状态 - 芙芙的狗的服务器</title>
<link rel="icon" href="icon.ico" type="image/x-icon">
<style>
    html, body { margin: 0; min-height: 100%; }
    body {
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        position: relative; overflow-x: hidden;
    }
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .bubble {
        position: absolute; bottom: -100px; background: rgba(255,255,255,0.08); border-radius: 50%;
        box-shadow: 0 0 10px rgba(79,172,254,0.3); animation: rise 10s infinite ease-in;
    }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: .6; } 100% { transform: translateY(-110vh) scale(1.5); opacity: 0; } }
    .container {
        position: relative; z-index: 10; max-width: 640px; margin: 60px auto; padding: 40px 50px;
        background: rgba(255,255,255,0.08); border-radius: 24px;
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        animation: fadeIn 1s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back { color: #a0c4ff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: .95em; line-height: 1; }
    .back:hover { color: #fff; }
    .icon { display: block; flex-shrink: 0; }
    h1 {
        color: #fff; text-align: center; font-size: 2em; margin: 10px 0 8px 0;
        text-shadow: 0 0 15px rgba(79,172,254,0.8); letter-spacing: 2px;
        display: flex; align-items: center; justify-content: center; gap: 14px; line-height: 1;
    }
    .subtitle { color: #a0c4ff; text-align: center; margin: 0 0 28px 0; font-weight: 300; }
    .banner {
        text-align: center; border-radius: 16px; padding: 16px; font-weight: bold; line-height: 1;
        margin-bottom: 22px; font-size: 1.1em; transition: .3s;
        background: rgba(255,255,255,0.1); color: #cfe3ff;
    }
    .banner.ok { background: rgba(67,233,123,0.15); border: 1px solid rgba(67,233,123,0.5); color: #43e97b; text-shadow: 0 0 10px rgba(67,233,123,0.5); }
    .banner.bad { background: rgba(255,110,110,0.12); border: 1px solid rgba(255,110,110,0.5); color: #ff8080; }
    .srow {
        display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.05);
        border-radius: 12px; padding: 14px 18px; margin: 10px 0;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #888; flex-shrink: 0; }
    .dot.ok { background: #43e97b; box-shadow: 0 0 10px rgba(67,233,123,0.8); }
    .dot.bad { background: #ff6e6e; box-shadow: 0 0 10px rgba(255,110,110,0.8); }
    .sname { color: #eaf4ff; flex: 1; font-size: .95em; }
    .srow b { color: #a0c4ff; font-family: Consolas, monospace; font-size: .9em; }
    .btn-refresh {
        width: 100%; margin-top: 22px; border: none; cursor: pointer; color: #fff;
        padding: 14px 0; border-radius: 50px; font-size: 1.05em; font-weight: bold; line-height: 1;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 4px 18px rgba(79,172,254,0.45);
        transition: .3s; font-family: inherit;
    }
    .btn-refresh:hover { transform: translateY(-3px); }
    .btn-refresh:disabled { opacity: .5; cursor: wait; transform: none; }
    .note { color: rgba(255,255,255,0.4); font-size: .8em; text-align: center; margin-top: 16px; }
    footer { margin-top: 32px; color: rgba(255,255,255,0.3); font-size: .85em; text-align: center; }
</style>
</head>
<body>
<!-- ===== 右上角登录/注册（按登录状态自动切换） ===== -->

    .top-auth{position:fixed;top:20px;right:24px;z-index:999;display:flex;gap:12px;}
    .btn-auth{text-decoration:none;padding:10px 26px;border-radius:50px;font-size:.95em;font-weight:bold;line-height:1;transition:all .3s;font-family:'Segoe UI','Microsoft YaHei',sans-serif;}
    .btn-auth-reg{color:#4facfe;border:2px solid #4facfe;background:rgba(79,172,254,0.08);}

    .btn-auth-login{color:#fff;background:linear-gradient(45deg,#4facfe,#00f2fe);box-shadow:0 4px 15px rgba(79,172,254,0.4);}
    .btn-auth-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,172,254,0.6);}
</style>

    <a href="dashboard/login.html" class="btn-auth btn-auth-login">登录</a>

<div class="bubbles">
    <div class="bubble" style="width: 40px; height: 40px; left: 10%; animation-duration: 8s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 20%; animation-duration: 5s; animation-delay: 1s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; left: 35%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; left: 50%; animation-duration: 15s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; left: 65%; animation-duration: 7s; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 80%; animation-duration: 10s; animation-delay: 2s;"></div>
</div>

<div class="container">
    <a href="index.html" class="back">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        返回主页
    </a>

    <h1>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        服务器状态
    </h1>
    <p class="subtitle">GitHub Actions 探针 · 每 5 分钟自动巡检 · DogOfFurina 专属</p>

    <div class="banner" id="banner">正在读取…</div>

    <div class="srow"><span class="dot" id="dApi"></span><span class="sname">API 服务器（注册）</span><b id="vApi">检测中…</b></div>
    <div class="srow"><span class="dot" id="dDispatch"></span><span class="sname">登陆服务器</span><b id="vDispatch">检测中…</b></div>
    <div class="srow"><span class="dot" id="dGame"></span><span class="sname">游戏服务器</span><b id="vGame">检测中…</b></div>

    <button class="btn-refresh" id="refreshBtn">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        立即刷新
    </button>
    <p class="note">点「立即刷新」= 插队触发一次即时检测</p>

    <footer>Powered by Grasscutter · 芙芙的狗 专属构建</footer>
</div>

<script>
    const GH_OWNER = 'DogOfFurina114514';
    const GH_REPO = 'GenshinServerWeb';
    const GH_WORKFLOW = 'status-check.yml';
    const GH_TOKEN = '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';

    const $ = id => document.getElementById(id);
    let shownTime = null;
    let checking = false;

    function applyRow(d, v, ok) {
        $(d).className = 'dot ' + (ok ? 'ok' : 'bad');
        $(v).textContent = ok ? '在线' : '离线';
    }

    function renderData(d) {
        applyRow('dApi', 'vApi', !!d.api);
        applyRow('dDispatch', 'vDispatch', !!d.dispatch);
        applyRow('dGame', 'vGame', !!d.game);
        const banner = $('banner');
        if (d.api && d.dispatch && d.game) {
            banner.className = 'banner ok';
            banner.textContent = '✅ 一切正常，提瓦特营业中（数据 ' + d.time + '）';
        } else {
            banner.className = 'banner bad';
            banner.textContent = '⚠️ 服务异常：请检查下方离线项（数据 ' + d.time + '）';
        }
        shownTime = d.time;
    }

    async function loadStatus() {
        try {
            const res = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
            return await res.json();
        } catch (e) { return null; }
    }

    // 进页面：直接显示上次检测好的数据
    (async () => {
        const d = await loadStatus();
        if (d) renderData(d);
        else { $('banner').className = 'banner bad'; $('banner').textContent = '⚠️ 无法读取状态文件'; }
    })();

    // 后台静默：每 30 秒对比时间戳，巡检一完成就无感刷新页面
    setInterval(async () => {
        if (checking) return;
        const d = await loadStatus();
        if (d && d.time !== shownTime) renderData(d);
    }, 30000);

    // 手动：插队触发 Action，圆点颜色不动，只改右边文字
    async function manualCheck() {
        if (checking) return;
        checking = true;
        const btn = $('refreshBtn');
        btn.disabled = true;
        ['vApi', 'vDispatch', 'vGame'].forEach(id => $(id).textContent = '检测中…');
        $('banner').className = 'banner';
        $('banner').textContent = '⏳ 已通知 GitHub 立即检测…';

        try {
            await fetch('https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/actions/workflows/' + GH_WORKFLOW + '/dispatches', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + GH_TOKEN,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ref: 'main' })
            });
        } catch (e) {}

        const oldTime = shownTime;
        const deadline = Date.now() + 180000;
        let updated = null;
        while (Date.now() < deadline) {
            await new Promise(r => setTimeout(r, 5000));
            const d = await loadStatus();
            if (d && d.time !== oldTime) { updated = d; break; }
        }

        checking = false;
        btn.disabled = false;
        if (updated) { renderData(updated); }
        else {
            const d = await loadStatus();
            if (d) renderData(d);
            $('banner').className = 'banner bad';
            $('banner').textContent = '⚠️ Failed to fetch';
        }
    }

    $('refreshBtn').addEventListener('click', manualCheck);
</script>
</body>
</html>

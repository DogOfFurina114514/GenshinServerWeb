<style>
    html, body { margin: 0; min-height: 100%; }
    body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; position: relative; overflow-x: hidden; }
    .bubbles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .bubble { position: absolute; bottom: -100px; background: rgba(255,255,255,0.08); border-radius: 50%; box-shadow: 0 0 10px rgba(79,172,254,0.3); animation: rise 10s infinite ease-in; }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: .6; } 100% { transform: translateY(-110vh) scale(1.5); opacity: 0; } }
    .container { position: relative; z-index: 10; max-width: 640px; margin: 60px auto; padding: 40px 50px; background: rgba(255,255,255,0.08); border-radius: 24px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: fadeIn 1s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .back { color: #a0c4ff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: .95em; line-height: 1; }
    .back:hover { color: #fff; }
    h1 { color: #fff; text-align: center; font-size: 2em; margin: 10px 0 8px 0; text-shadow: 0 0 15px rgba(79,172,254,0.8); letter-spacing: 2px; display: flex; align-items: center; justify-content: center; gap: 14px; line-height: 1; }
    .subtitle { color: #a0c4ff; text-align: center; margin: 0 0 28px 0; font-weight: 300; }
    .rt { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .85em; color: rgba(255,255,255,0.5); margin-bottom: 20px; }
    .rt i { width: 10px; height: 10px; border-radius: 50%; background: #ffd200; display: inline-block; }
    .rt.on { color: #43e97b; }
    .rt.on i { background: #43e97b; box-shadow: 0 0 10px #43e97b; animation: pulse 1.6s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .6; } }
    .banner { text-align: center; border-radius: 16px; padding: 16px; font-weight: bold; line-height: 1; margin-bottom: 22px; font-size: 1.1em; transition: .3s; background: rgba(255,255,255,0.1); color: #cfe3ff; }
    .banner.ok { background: rgba(67,233,123,0.15); border: 1px solid rgba(67,233,123,0.5); color: #43e97b; text-shadow: 0 0 10px rgba(67,233,123,0.5); }
    .banner.bad { background: rgba(255,110,110,0.12); border: 1px solid rgba(255,110,110,0.5); color: #ff8080; }
    .srow { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px 18px; margin: 10px 0; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #888; flex-shrink: 0; transition: .3s; }
    .dot.ok { background: #43e97b; box-shadow: 0 0 10px rgba(67,233,123,0.8); }
    .dot.bad { background: #ff6e6e; box-shadow: 0 0 10px rgba(255,110,110,0.8); }
    .sname { color: #eaf4ff; flex: 1; font-size: .95em; }
    .srow b { color: #a0c4ff; font-family: Consolas, monospace; font-size: .9em; }
    .btn-refresh { width: 100%; margin-top: 22px; border: none; cursor: pointer; color: #fff; padding: 14px 0; border-radius: 50px; font-size: 1.05em; font-weight: bold; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(45deg, #4facfe, #00f2fe); box-shadow: 0 4px 18px rgba(79,172,254,0.45); transition: .3s; font-family: inherit; }
    .btn-refresh:hover { transform: translateY(-3px); }
    .btn-refresh:disabled { opacity: .5; cursor: wait; transform: none; }
    .note { color: rgba(255,255,255,0.4); font-size: .8em; text-align: center; margin-top: 16px; }
    footer { margin-top: 32px; color: rgba(255,255,255,0.3); font-size: .85em; text-align: center; }
</style>
</head>
<body>
<style>
    .top-auth{position:fixed;top:20px;right:24px;z-index:999;display:flex;gap:12px;}
    .btn-auth{text-decoration:none;padding:10px 26px;border-radius:50px;font-size:.95em;font-weight:bold;line-height:1;transition:all .3s;font-family:'Segoe UI','Microsoft YaHei',sans-serif;}
    .btn-auth-reg{color:#4facfe;border:2px solid #4facfe;background:rgba(79,172,254,0.08);}
    .btn-auth-reg:hover{background:rgba(79,172,254,0.25);color:#fff;transform:translateY(-2px);}
    .btn-auth-login{color:#fff;background:linear-gradient(45deg,#4facfe,#00f2fe);box-shadow:0 4px 15px rgba(79,172,254,0.4);}
    .btn-auth-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,172,254,0.6);}
    @keyframes flyIn{from{transform:translateX(140px);opacity:0;}to{transform:translateX(0);opacity:1;}}
    .fly-1{animation:flyIn .6s cubic-bezier(.2,.8,.25,1) backwards;}
    .fly-2{animation:flyIn .6s cubic-bezier(.2,.8,.25,1) .2s backwards;}
</style>
<div class="top-auth" id="topAuth" style="visibility:hidden"></div>
<script>
(function () {
    var pre = location.pathname.indexOf('/enter/') !== -1 ? '../' : '';
    var cur = location.pathname; if (cur === '/' || cur === '') cur = '/index.html'; if (cur.charAt(cur.length - 1) === '/') cur += 'index.html';
    var FOUR = ['/index.html', '/handbook.html', '/status.html', '/enter/quick_start.html'];
    var last = sessionStorage.getItem('topauth_last') || '';
    var internal = FOUR.indexOf(cur) !== -1 && FOUR.indexOf(last) !== -1 && last !== cur;
    sessionStorage.setItem('topauth_last', cur);
    function paint(session) {

        var a1 = internal ? '' : ' fly-1', a2 = internal ? '' : ' fly-2';
        box.innerHTML = session
            ? '<a href="' + pre + 'dashboard/index.html" class="btn-auth btn-auth-login' + a1 + '">进入控制台</a>'
            : '<a href="' + pre + 'dashboard/login.html?mode=register" class="btn-auth btn-auth-reg' + a1 + '">注册</a><a href="' + pre + 'dashboard/login.html" class="btn-auth btn-auth-login' + a2 + '">登录</a>';
        box.style.visibility = 'visible';
    }
    if (window.supabase) window.supabase.createClient('https://kusbgdswjbaqpczfelnv.supabase.co', 'sb_publishable_HQRWpFHQmyIblqhqeeoeZg_qD-3U3go').auth.getSession().then(function (r) { paint(!!r.data.session); }).catch(function () { paint(false); });
})();
</script>

<div class="bubbles">
    <div class="bubble" style="width: 40px; height: 40px; left: 10%; animation-duration: 8s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 20%; animation-duration: 5s; animation-delay: 1s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; left: 35%; animation-duration: 12s; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 80px; height: 80px; left: 50%; animation-duration: 15s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; left: 65%; animation-duration: 7s; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 80%; animation-duration: 10s; animation-delay: 2s;"></div>
</div>

<div class="container">
    <a href="index.html" class="back">← 返回主页</a>
    <h1>服务器状态</h1>
    <p class="subtitle">Supabase 驱动 · 进入页面自动检测</p>

    <div class="rt" id="rt"><i></i><span>实时通道连接中...</span></div>
    <div class="banner" id="banner">⏳ 正在检测服务状态…</div>

    <div class="srow"><span class="dot" id="dApi"></span><span class="sname">API 服务器（注册）</span><b id="vApi">检测中…</b></div>
    <div class="srow"><span class="dot" id="dDispatch"></span><span class="sname">登陆服务器 (Dispatch)</span><b id="vDispatch">检测中…</b></div>
    <div class="srow"><span class="dot" id="dGame"></span><span class="sname">游戏服务器 (Game)</span><b id="vGame">检测中…</b></div>

    <button class="btn-refresh" id="refreshBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        立即刷新
    </button>
    <p class="note">进入页面自动检测 · 点按钮立即重新检测（检测时灯不变，完成后才变色）</p>
    <footer>Powered by Grasscutter · 芙芙的狗 专属构建</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const API_BASE = 'https://kusbgdswjbaqpczfelnv.supabase.co/functions/v1/genshin-api';
const sb = window.supabase.createClient('https://kusbgdswjbaqpczfelnv.supabase.co', 'sb_publishable_HQRWpFHQmyIblqhqeeoeZg_qD-3U3go');
const $ = id => document.getElementById(id);
const NAMES = ['api', 'dispatch', 'game'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
let checking = false;

// 灯变绿/变红 + 文字变 在线/离线
function applyRow(name, ok) {
    const dot = $('d' + cap(name));
    const val = $('v' + cap(name));
    if (!dot || !val) return;
    dot.className = 'dot ' + (ok ? 'ok' : 'bad');
    val.textContent = ok ? '在线' : '离线';
    updateBanner();
}

// 根据三个灯的状态更新顶部横幅
function updateBanner() {
    const states = NAMES.map(n => {
        const d = $('d' + cap(n));
        return d.classList.contains('ok') ? 1 : d.classList.contains('bad') ? 0 : -1;
    });
    if (states.includes(-1)) return;   // 还有灯在检测中，横幅不动
    const banner = $('banner');
    if (states.every(s => s === 1)) {
        banner.className = 'banner ok';
        banner.textContent = '✅ 一切正常，提瓦特营业中';
    } else {
        banner.className = 'banner bad';
        banner.textContent = '⚠️ 服务异常：请检查下方离线项';
    }
}

// 进入页面：灯全部灰色 + 文字“检测中…”
function setGray() {
    NAMES.forEach(n => {
        $('d' + cap(n)).className = 'dot';          // 灰色灯
        $('v' + cap(n)).textContent = '检测中…';
    });
    $('banner').className = 'banner';
    $('banner').textContent = '⏳ 正在检测服务状态…';
}

// 手动刷新：灯不变，只把文字改成“检测中…”
function setTextChecking() {
    NAMES.forEach(n => { $('v' + cap(n)).textContent = '检测中…'; });
    $('banner').className = 'banner';
    $('banner').textContent = '⏳ 正在检测服务状态…';
}

// 执行一次检测：mode = 'init'（进页面）或 'manual'（点按钮）
async function runCheck(mode) {
    if (checking) return;
    checking = true;
    if (mode === 'init') setGray(); else setTextChecking();
    try {
        const res = await fetch(API_BASE + '/status');
        const d = await res.json();
        if (d.ok && d.services) {
            d.services.forEach(s => applyRow(s.name, s.ok));   // 检测完成，灯才变色
        } else { throw new Error(); }
    } catch (e) {
        NAMES.forEach(n => applyRow(n, false));
        $('banner').className = 'banner bad';
        $('banner').textContent = '⚠️ 检测失败：无法连接后端';
    }
    checking = false;
}

// 实时订阅：其他页面/标签页触发的检测也会同步过来
sb.channel('status_rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'server_status' }, function (p) {
        if (p.new && !checking) applyRow(p.new.name, p.new.ok);
    })
    .subscribe(function (state) {
        const rt = $('rt');
        if (state === 'SUBSCRIBED') { rt.classList.add('on'); rt.querySelector('span').textContent = '实时通道已连接'; }
        else { rt.classList.remove('on'); rt.querySelector('span').textContent = '实时通道连接中...'; }
    });

// 点「立即刷新」：按钮变灰 + 显示检测中，灯不变，完成后才变
$('refreshBtn').addEventListener('click', async function () {
    if (checking) return;
    const btn = $('refreshBtn');
    const oldHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳ 检测中…';
    await runCheck('manual');
    btn.innerHTML = oldHtml;
    btn.disabled = false;
});

// 进入页面立刻开始检测（灯灰色 → 完成后变色）
runCheck('init');
</script>
</body>
</html>
